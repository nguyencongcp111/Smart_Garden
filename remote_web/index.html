  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Agri Weather App - Thời Tiết Nông Nghiệp Thông Minh" />
  <meta property="og:description"
    content="Ứng dụng thời tiết chuyên dụng cho nông dân Việt Nam. Dự báo chính xác, cảnh báo thiên tai, và lời khuyên canh tác dựa trên thời tiết thực tế." />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />

  <meta property="twitter:description"
    content="Ứng dụng thời tiết chuyên dụng cho nông dân Việt Nam. Dự báo chính xác, cảnh báo thiên tai, và lời khuyên canh tác dựa trên thời tiết thực tế." />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Icon -->
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />

  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }

    /* Simple loading spinner for initial load */
    .initial-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #f8fafc;
      z-index: 9999;
      transition: opacity 0.3s ease-out;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #e2e8f0;
      border-top-color: #0ea5e9;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root">
    <!-- Initial loading state visible before React mounts -->
    <div class="initial-loader">
      <div class="spinner"></div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
